apiVersion: apps/v1
kind: Deployment
metadata:
  name: movie
spec:
  replicas: 5
  selector:
    matchLabels:
      app: movie
  template:
    metadata:
      labels:
        app: movie
    spec:
      containers:
      - name: movie
        image: mallesh261/movie
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: movie-svc
spec:
  selector:
    app: movie
  ports:
  - port: 80
    targetPort: 5000
---
